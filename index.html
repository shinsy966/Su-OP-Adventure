    function getUpgradeCycleDirection(key) {
      const level = profile.upgrades[key];
      if (level <= 0) return 'up';
      if (level >= MAX_UPGRADE_LEVEL) return 'down';
      return profile.upgradeCycleDirections[key] === 'down' ? 'down' : 'up';
    }

    function useUpgradeCircle(key) {
      const level = profile.upgrades[key];
      const direction = getUpgradeCycleDirection(key);
      if (direction === 'down' && level > 0) {
        profile.upgrades[key] -= 1;
        profile.tokens += 1;
        profile.upgradeCycleDirections[key] = profile.upgrades[key] === 0 ? 'up' : 'down';
        saveProfile();
        return;
      }
      if (profile.tokens <= 0) {
        if (level <= 0) return;
        profile.upgrades[key] -= 1;
        profile.tokens += 1;
        profile.upgradeCycleDirections[key] = profile.upgrades[key] === 0 ? 'up' : 'down';
        saveProfile();
        return;
      }
      if (level >= MAX_UPGRADE_LEVEL) return;
      profile.upgrades[key] += 1;
      profile.tokens -= 1;
      profile.upgradeCycleDirections[key] = profile.upgrades[key] === MAX_UPGRADE_LEVEL ? 'down' : 'up';
      saveProfile();
    }

    function openStageSelectOrStart() {
      if (profile.stage1Cleared) {
        screen = 'stageSelect';
        return;
      }
      startGame(1);
    }

    function startGame(stage = 1) {
      currentStage = stage;
      resetGame();
      bgmStep = 0;
      screen = 'game';
      if (currentStage === 2) openChoices();
      syncBgm();
    }

    function restartCurrentStage() {
      resetGame();
      bgmStep = 0;
      screen = 'game';
      if (currentStage === 2) openChoices();
      syncBgm();
    }

    function startNextStage() {
      if (currentStage === 1) startGame(2);
    }

    function reviveGame() {
      runtimeError = null;
      player.hp = player.maxHp;
      player.invulnerableTimer = 2;
      gameOver = false;
      gamePaused = false;
      playSfx('choice');
      syncBgm();
    }

    function exitToMainMenu() {
      runtimeError = null;
      gameOver = false;
      gamePaused = false;
      screen = 'menu';
      syncBgm();
    }

    // Keep a single bad visual effect from cancelling the rest of this frame.
    // In particular, this guarantees that the game-over panel can still render.
    function drawSafely(layerName, renderer) {
      ctx.save();
      try {
        renderer();
      } catch (error) {
        console.error(`Render error in ${layerName}`, error);
      } finally {
        ctx.restore();
      }
    }

    function handleRuntimeError(phase, error) {
      console.error(`Game ${phase} error`, error);
      runtimeError = { phase, error };
      clearTouchMovement();
      choiceOpen = false;
      paused = false;
      gamePaused = false;
      victory = false;
      gameOver = true;
      stopBgm();
    }

    function recoverLevel20BossState(error) {
      if (screen !== 'game' || !boss || boss.level !== 20) return false;
      console.error('Recovered level 20 boss state', error);
      // Do not reset valid cooldowns on every recovered frame. Repeated
      // recovery used to keep the boss permanently waiting to attack.
      if (!['idle', 'prepare', 'charge'].includes(boss.chargeState)) boss.chargeState = 'idle';
      if (!Number.isFinite(boss.chargeCooldown)) boss.chargeCooldown = 1.6;
      if (!Number.isFinite(boss.chargeTimer)) boss.chargeTimer = 0;
      if (!Number.isFinite(boss.cooldown)) boss.cooldown = 0.8;
      if (!Number.isFinite(boss.chargeCount)) boss.chargeCount = 0;
      if (!Number.isFinite(boss.slamCooldown)) boss.slamCooldown = currentStage === 2 ? 4.5 : Infinity;
      if (!Number.isFinite(boss.slamPunchTimer)) boss.slamPunchTimer = 0;
      if (boss.chargeDirection
        && (!Number.isFinite(boss.chargeDirection.x) || !Number.isFinite(boss.chargeDirection.y))) {
        boss.chargeDirection = null;
        boss.chargeState = 'prepare';
        boss.chargeTimer = 0.35;
      }
      return true;
    }

    function drawEmergencyGameOver() {
      const pixelRatio = canvas.width / WIDTH;
      ctx.save();
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      ctx.fillStyle = '#061421';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.textAlign = 'center';
      ctx.font = '800 48px Arial';
      ctx.fillStyle = '#fda4af';
      ctx.fillText('GAME OVER', WIDTH / 2, HEIGHT / 2 - 26);
      ctx.font = '600 18px Arial';
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText('오류로 게임을 종료했습니다. 재시작해 주세요.', WIDTH / 2, HEIGHT / 2 + 12);
      if (MOBILE_LAYOUT) {
        drawButton(78, 462, WIDTH - 156, 54, '부활');
        drawButton(78, 532, WIDTH - 156, 54, '다시 시작');
        drawButton(78, 602, WIDTH - 156, 54, '메인 화면으로');
      } else {
        drawButton(184, 370, 150, 62, '부활');
        drawButton(355, 370, 150, 62, '다시 시작');
        drawButton(526, 370, 150, 62, '메인 화면으로');
      }
      ctx.restore();
    }

    function draw() {
      if (screen === 'menu') {
        drawMainMenu();
        return;
      }
      if (screen === 'stageSelect') {
        drawStageSelect();
        return;
      }
      if (screen === 'upgrades') {
        drawUpgrades();
        return;
      }
      if (screen === 'achievements') {
        drawAchievements();
        return;
      }
      drawSafely('background', drawBackground);
      drawSafely('boss strike warnings', drawBossStrikeWarnings);
      drawSafely('fire zones', drawFireZones);
      drawSafely('pickups', drawPickups);
      drawSafely('enemies', drawEnemies);
      drawSafely('attacks', drawAttacks);
      drawSafely('boss', drawBoss);
      drawSafely('boss effects', drawBossExplosions);
      drawSafely('shield', drawShield);
      drawSafely('player', drawPlayer);
      drawSafely('shurikens', drawShurikens);
      drawSafely('UI', drawUI);
      // Touch movement stays enabled; only the on-screen joystick graphic is hidden.
      drawSafely('boss alert', drawBossAlert);
      drawSafely('augment choices', drawChoiceOverlay);
      drawSafely('game-over panel', drawOverlay);
      drawSafely('pause panel', drawPauseOverlay);
      drawSafely('pause control', drawPauseControl);
    }

    function gameLoop(now) {
      const delta = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      if (runtimeError) {
        drawEmergencyGameOver();
        requestAnimationFrame(gameLoop);
        return;
      }
      try {
        update(delta);
        draw();
      } catch (error) {
        if (recoverLevel20BossState(error)) {
          draw();
          requestAnimationFrame(gameLoop);
          return;
        }
        handleRuntimeError('loop', error);
        drawEmergencyGameOver();
      }
      requestAnimationFrame(gameLoop);
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (WIDTH / rect.width),
        y: (event.clientY - rect.top) * (HEIGHT / rect.height),
      };
    }

    function canUseTouchMovement() {
      return screen === 'game' && !gameOver && !victory && !paused && !gamePaused && !choiceOpen;
    }

    canvas.addEventListener('pointerdown', (event) => {
      if (event.pointerType !== 'touch' || !canUseTouchMovement()) return;
      const point = getCanvasPoint(event);
      touchMovement.active = true;
      touchMovement.pointerId = event.pointerId;
      touchMovement.startX = point.x;
      touchMovement.startY = point.y;
      touchMovement.x = 0;
      touchMovement.y = 0;
      try {
        canvas.setPointerCapture(event.pointerId);
      } catch {
        // 일부 모바일 브라우저는 포인터 캡처를 지원하지 않는다.
      }
      event.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', (event) => {
      if (event.pointerId !== touchMovement.pointerId || !touchMovement.active) return;
      const point = getCanvasPoint(event);
      const dx = point.x - touchMovement.startX;
      const dy = point.y - touchMovement.startY;
      const distance = Math.hypot(dx, dy);
      if (distance < 12) {
        touchMovement.x = 0;
        touchMovement.y = 0;
      } else {
        touchMovement.x = dx / distance;
        touchMovement.y = dy / distance;
      }
      event.preventDefault();
    }, { passive: false });

    function endTouchMovement(event) {
      if (event.pointerId !== touchMovement.pointerId) return;
      clearTouchMovement();
      if (event.cancelable) event.preventDefault();
    }

    canvas.addEventListener('pointerup', endTouchMovement, { passive: false });
    canvas.addEventListener('pointercancel', endTouchMovement, { passive: false });
    canvas.addEventListener('lostpointercapture', endTouchMovement, { passive: false });

    function isInside(x, y, buttonX, buttonY, width, height) {
      return x >= buttonX && x <= buttonX + width && y >= buttonY && y <= buttonY + height;
    }

    canvas.addEventListener('click', (event) => {
      const { x, y } = getCanvasPoint(event);
      if (usesTouchControls() && screen === 'game' && !choiceOpen && !gameOver && !victory
        && isInside(x, y, PAUSE_BUTTON.x, PAUSE_BUTTON.y, PAUSE_BUTTON.size, PAUSE_BUTTON.size)) {
        toggleGamePause();
        return;
      }
      if (screen === 'game' && victory) {
        if (MOBILE_LAYOUT) {
        if (currentStage === 1) {
          if (isInside(x, y, 78, 450, WIDTH - 156, 58)) startNextStage();
          if (isInside(x, y, 78, 524, WIDTH - 156, 58)) restartCurrentStage();
          if (isInside(x, y, 78, 598, WIDTH - 156, 58)) exitToMainMenu();
          if (isInside(x, y, 78, 450, WIDTH - 156, 206)) return;
        }
        if (isInside(x, y, 78, 480, WIDTH - 156, 58)) restartCurrentStage();
        if (isInside(x, y, 78, 554, WIDTH - 156, 58)) exitToMainMenu();
        if (isInside(x, y, 78, 480, WIDTH - 156, 132)) return;
        }
        if (currentStage === 1) {
          if (isInside(x, y, 242, 330, 376, 58)) startNextStage();
          if (isInside(x, y, 242, 408, 180, 62)) restartCurrentStage();
          if (isInside(x, y, 438, 408, 180, 62)) exitToMainMenu();
          return;
        }
        if (isInside(x, y, 242, 370, 180, 62)) restartCurrentStage();
        if (isInside(x, y, 438, 370, 180, 62)) exitToMainMenu();
        return;
      }
      if (screen === 'game' && gameOver) {
        if (MOBILE_LAYOUT) {
        if (isInside(x, y, 78, 462, WIDTH - 156, 54)) reviveGame();
        if (isInside(x, y, 78, 532, WIDTH - 156, 54)) restartCurrentStage();
        if (isInside(x, y, 78, 602, WIDTH - 156, 54)) exitToMainMenu();
        if (isInside(x, y, 78, 462, WIDTH - 156, 194)) return;
        }
        if (isInside(x, y, 184, 370, 150, 62)) reviveGame();
        if (isInside(x, y, 355, 370, 150, 62)) restartCurrentStage();
        if (isInside(x, y, 526, 370, 150, 62)) exitToMainMenu();
        return;
      }
      if (screen === 'game' && gamePaused) {
        if (MOBILE_LAYOUT) {
        if (isInside(x, y, 78, 394, WIDTH - 156, 54)) {
          soundSettings.bgm = !soundSettings.bgm;
          syncBgm();
          playSfx('click');
          return;
        }
        if (isInside(x, y, 78, 464, WIDTH - 156, 54)) {
          soundSettings.sfx = !soundSettings.sfx;
          if (soundSettings.sfx) playSfx('click');
          return;
        }
        if (isInside(x, y, 78, 534, 184, 54)) {
          exitToMainMenu();
          return;
        }
        if (isInside(x, y, 278, 534, 184, 54)) {
          toggleGamePause();
          return;
        }
        return;
        }
        if (isInside(x, y, 242, 290, 180, 58)) {
          soundSettings.bgm = !soundSettings.bgm;
          syncBgm();
          playSfx('click');
        }
        if (isInside(x, y, 438, 290, 180, 58)) {
          soundSettings.sfx = !soundSettings.sfx;
          if (soundSettings.sfx) playSfx('click');
        }
        if (isInside(x, y, 242, 370, 180, 52)) exitToMainMenu();
        if (isInside(x, y, 438, 370, 180, 52)) toggleGamePause();
        return;
      }
      if (screen === 'game' && choiceOpen) {
        if (MOBILE_LAYOUT) {
        getPortraitChoiceCardLayout().forEach(({ choice, x: cardX, y: cardY, width: cardWidth, height: cardHeight }) => {
          if (isInside(x, y, cardX, cardY, cardWidth, cardHeight)) applyAugment(choice);
        });
        return;
        }
        const cardWidth = 225;
        const cardHeight = 300;
        const cardY = 205;
        const gap = 28;
        const startX = (WIDTH - (cardWidth * 3 + gap * 2)) / 2;
        choices.forEach((choice, index) => {
          const cardX = startX + index * (cardWidth + gap);
          if (isInside(x, y, cardX, cardY, cardWidth, cardHeight)) applyAugment(choice);
        });
        return;
      }
      if (screen === 'menu') {
        if (MOBILE_LAYOUT) {
        if (isInside(x, y, 54, 382, WIDTH - 108, 68)) openStageSelectOrStart();
        if (isInside(x, y, 54, 472, WIDTH - 108, 68)) screen = 'upgrades';
        if (isInside(x, y, 54, 562, WIDTH - 108, 68)) openAchievements();
        if (isInside(x, y, 54, 382, WIDTH - 108, 248)) return;
        }
        if (isInside(x, y, 520, 180, 260, 76)) openStageSelectOrStart();
        if (isInside(x, y, 520, 280, 260, 76)) screen = 'upgrades';
        if (isInside(x, y, 520, 380, 260, 76)) openAchievements();
        return;
      }
      if (screen === 'stageSelect') {
        if (MOBILE_LAYOUT) {
          if (isInside(x, y, 54, 286, WIDTH - 108, 72)) startGame(1);
          if (isInside(x, y, 54, 388, WIDTH - 108, 72)) startGame(2);
          if (isInside(x, y, 150, 530, 240, 56)) screen = 'menu';
          return;
        }
        if (isInside(x, y, 204, 280, 260, 82)) startGame(1);
        if (isInside(x, y, 496, 280, 260, 82)) startGame(2);
        if (isInside(x, y, 370, 430, 180, 56)) screen = 'menu';
        return;
      }
      if (screen === 'upgrades') {
        if (MOBILE_LAYOUT) {
        if (isInside(x, y, 150, 600, 240, 56)) {
          screen = 'menu';
          return;
        }
        let portraitUpgradeHit = false;
        UPGRADE_OPTIONS.forEach((option, index) => {
          const rowY = 174 + index * 94;
          for (let pip = 0; pip < MAX_UPGRADE_LEVEL; pip++) {
            const pipX = 326 + pip * 36;
            if (Math.hypot(x - pipX, y - (rowY + 38)) <= 16) {
              useUpgradeCircle(option.key);
              portraitUpgradeHit = true;
              return;
            }
          }
          if (isInside(x, y, 28, rowY, WIDTH - 56, 76)) {
            useUpgradeCircle(option.key);
            portraitUpgradeHit = true;
          }
        });
        if (portraitUpgradeHit) return;
        }
        if (isInside(x, y, 530, 530, 160, 52)) {
          screen = 'menu';
          return;
        }
        UPGRADE_OPTIONS.forEach((option, index) => {
          const rowY = 170 + index * 85;
          for (let pip = 0; pip < MAX_UPGRADE_LEVEL; pip++) {
            const pipX = 450 + pip * 37;
            if (Math.hypot(x - pipX, y - (rowY + 33)) <= 17) {
              useUpgradeCircle(option.key);
              return;
            }
          }
          if (isInside(x, y, 170, rowY, 520, 66)) {
            useUpgradeCircle(option.key);
          }
        });
        return;
      }
      if (screen === 'achievements') {
        if (MOBILE_LAYOUT) {
        if (isInside(x, y, 150, 820, 240, 54)) {
          screen = 'menu';
          return;
        }
        getAchievementLayout().forEach(({ achievement, y: portraitRowY }) => {
          if (!isInside(x, y, 28, portraitRowY - 20, WIDTH - 70, 32)) return;
          claimAchievement(achievement);
        });
        if (x >= 28 && x <= WIDTH - 42 && y >= 132 && y <= 780) return;
        }
        if (isInside(x, y, 530, 550, 160, 48)) {
          screen = 'menu';
          return;
        }
        getAchievementLayout().forEach(({ achievement, y: rowY }) => {
          if (!isInside(x, y, 180, rowY - 20, 28, 28)) return;
          claimAchievement(achievement);
        });
      }
    });

    canvas.addEventListener('wheel', (event) => {
      if (screen !== 'achievements' || MOBILE_LAYOUT) return;
      event.preventDefault();
      const maxScroll = getAchievementScrollMax();
      achievementScroll = clamp(achievementScroll + event.deltaY * 0.7, 0, maxScroll);
    }, { passive: false });

    window.addEventListener('keydown', (event) => {
      keys[event.key] = true;
      if (event.key === 'Escape') {
        if (screen === 'game' && !choiceOpen && !gameOver && !victory) {
          toggleGamePause();
        } else if (screen !== 'game') {
          screen = 'menu';
          syncBgm();
        }
      }
      if (screen === 'game' && event.key.toLowerCase() === 'r') resetGame();
      if (screen === 'game' && choiceOpen && event.key === '1') applyAugment(choices[0]);
      if (screen === 'game' && choiceOpen && event.key === '2') applyAugment(choices[1]);
      if (screen === 'game' && choiceOpen && event.key === '3') applyAugment(choices[2]);
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown' || event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
      }
    });

    window.addEventListener('keyup', (event) => {
      keys[event.key] = false;
    });

    resetGame();
    screen = 'menu';
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Version the worker URL as well as its cache. This prevents a CDN
        // cached worker response from keeping installed Android PWAs on an
        // older release after the page itself has already updated.
        navigator.serviceWorker.register('./sw.js?v=49', { updateViaCache: 'none' }).then((registration) => {
          registration.update();
        }).catch(() => {});
      });
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>

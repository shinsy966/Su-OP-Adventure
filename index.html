<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#130d1f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Su OP Adventure" />
  <title>뱀파이어 서바이벌</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/pwa-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      background: #08070c;
      color: #fff;
      font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }
    canvas {
      box-sizing: border-box;
      height: auto;
      border: 3px solid #8b5cf6;
      background: #130d1f;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html[data-layout="mobile"] canvas {
      width: min(100vw, calc(100dvh * 9 / 16));
      aspect-ratio: 9 / 16;
    }
    html[data-layout="desktop"] canvas {
      width: min(calc(100vw - 120px), calc((100dvh - 120px) * 43 / 31));
      aspect-ratio: 43 / 31;
    }
    @media (max-width: 700px) {
      html[data-layout="mobile"] canvas {
        border: 0;
      }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1080" height="1920" aria-label="Su OP Adventure"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const MOBILE_LAYOUT = window.matchMedia('(pointer: coarse)').matches
      || (navigator.maxTouchPoints > 0 && window.innerWidth <= 900);
    document.documentElement.dataset.layout = MOBILE_LAYOUT ? 'mobile' : 'desktop';
    // 기기별 논리 해상도. 실제 캔버스는 기기 픽셀 비율만큼 크게 만들어 선명하게 그린다.
    const WIDTH = MOBILE_LAYOUT ? 540 : 860;
    const HEIGHT = MOBILE_LAYOUT ? 960 : 620;
    const MOBILE_UNIT_SCALE = 0.95;
    const MOBILE_BOSS_SCALE = MOBILE_UNIT_SCALE * 0.9;
    function configureCanvasResolution() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(WIDTH * pixelRatio);
      canvas.height = Math.round(HEIGHT * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      ctx.imageSmoothingEnabled = true;
    }
    configureCanvasResolution();
    window.addEventListener('resize', configureCanvasResolution);
    const WORLD_WIDTH = 2600;
    const WORLD_HEIGHT = 1800;
    const camera = { x: 0, y: 0 };
    const SPRITE_ASSETS = {
      player: { file: 'sprite-player.png', crop: [0.22, 0.18, 0.58, 0.72] },
      bat: { file: 'sprite-bat.png', crop: [0.02, 0.26, 0.96, 0.50] },
      slime: { file: 'sprite-slime-zombie.png', crop: [0.05, 0.42, 0.46, 0.35] },
      zombie: { file: 'sprite-slime-zombie.png', crop: [0.53, 0.23, 0.45, 0.55] },
      miniBoss1: { file: 'sprite-boss-golem.png', crop: [0.05, 0.05, 0.90, 0.90] },
      miniBoss2: { file: 'sprite-boss-dragon.png', crop: [0.01, 0.18, 0.98, 0.68] },
      frostWolf: { file: 'sprites-stage2-normal-contrast-clean.png', crop: [0.006, 0.006, 0.321, 0.486], chroma: true },
      iceSpirit: { file: 'sprites-stage2-normal-contrast-clean.png', crop: [0.339, 0.006, 0.321, 0.486], chroma: true },
      iceKnight: { file: 'sprites-stage2-normal-contrast-clean.png', crop: [0.673, 0.006, 0.321, 0.486], chroma: true },
      iceDragon: { file: 'sprites-stage2-dusk-chroma.png', crop: [0.006, 0.506, 0.321, 0.486], chroma: true },
      iceGolem: { file: 'sprites-stage2-dusk-chroma.png', crop: [0.339, 0.506, 0.321, 0.486], chroma: true },
    };
    const spriteImages = {};
    Object.entries(SPRITE_ASSETS).forEach(([name, asset]) => {
      if (asset.chroma) return;
      const image = new Image();
      image.src = `assets/${encodeURIComponent(asset.file)}`;
      spriteImages[name] = image;
    });
    const augmentIconImages = {};
    const AUGMENT_ICON_CELLS = {
      damage: [0, 0], maxHp: [1, 0], attackSpeed: [2, 0], area: [3, 0],
      pickup: [0, 1], heal: [1, 1], pierce: [2, 1], extraShot: [3, 1],
      shuriken: [0, 2], fireZone: [1, 2], shield: [2, 2],
    };

    function makeChromaTransparent(image, removeWhiteEdgeFringe = false) {
      const processed = document.createElement('canvas');
      processed.width = image.naturalWidth || image.width;
      processed.height = image.naturalHeight || image.height;
      const processedCtx = processed.getContext('2d');
      processedCtx.drawImage(image, 0, 0, processed.width, processed.height);
      const pixels = processedCtx.getImageData(0, 0, processed.width, processed.height);
      for (let i = 0; i < pixels.data.length; i += 4) {
        const red = pixels.data[i];
        const green = pixels.data[i + 1];
        const blue = pixels.data[i + 2];
        if (green > 120 && green - Math.max(red, blue) > 70) pixels.data[i + 3] = 0;
      }
      if (removeWhiteEdgeFringe) {
        const width = processed.width;
        const height = processed.height;
        // The generated sheet has a several-pixel pale anti-alias halo. Peel
        // it away in passes; a single pass only removes the outermost pixel.
        for (let pass = 0; pass < 5; pass++) {
          const edgePixels = [];
          for (let y = 1; y < height - 1; y++) {
            for (let x = 1; x < width - 1; x++) {
              const index = (y * width + x) * 4;
              const red = pixels.data[index];
              const green = pixels.data[index + 1];
              const blue = pixels.data[index + 2];
              const brightest = Math.max(red, green, blue);
              const darkest = Math.min(red, green, blue);
              // Only exterior near-white / pale gray pixels are removed. The
              // saturated cyan crystals, gold armor, and magenta spirit stay.
              const isPaleEdge = brightest >= 120
                && brightest - darkest <= 86
                && blue - red <= 62
                && green - red <= 62;
              if (pixels.data[index + 3] === 0 || !isPaleEdge) continue;
              const neighborIndexes = [index - 4, index + 4, index - width * 4, index + width * 4];
              if (neighborIndexes.some((neighbor) => pixels.data[neighbor + 3] === 0)) edgePixels.push(index);
            }
          }
          if (edgePixels.length === 0) break;
          edgePixels.forEach((index) => { pixels.data[index + 3] = 0; });
        }
      }
      processedCtx.putImageData(pixels, 0, 0);
      return processed;
    }

    const stage2NormalSpriteSheet = new Image();
    stage2NormalSpriteSheet.onload = () => {
      const processed = makeChromaTransparent(stage2NormalSpriteSheet, true);
      ['frostWolf', 'iceSpirit', 'iceKnight'].forEach((name) => {
        spriteImages[name] = processed;
      });
    };
    stage2NormalSpriteSheet.src = 'assets/sprites-stage2-normal-contrast-clean.png';

    const stage2BossSpriteSheet = new Image();
    stage2BossSpriteSheet.onload = () => {
      const processed = makeChromaTransparent(stage2BossSpriteSheet);
      ['iceDragon', 'iceGolem'].forEach((name) => {
        spriteImages[name] = processed;
      });
    };
    stage2BossSpriteSheet.src = 'assets/sprites-stage2-dusk-chroma.png';

    const snowBackgroundImage = new Image();
    snowBackgroundImage.src = 'assets/background-snowfield-dusk.png';

    const augmentSheetImage = new Image();
    augmentSheetImage.onload = () => {
      augmentIconImages.sheet = makeChromaTransparent(augmentSheetImage);
    };
    augmentSheetImage.src = 'assets/augment-icons-v2-chroma.png';

    const wingedShoeImage = new Image();
    wingedShoeImage.onload = () => {
      augmentIconImages.speed = makeChromaTransparent(wingedShoeImage);
    };
    wingedShoeImage.src = 'assets/augment-speed-boot-chroma.png';

    const attackSpeedImage = new Image();
    attackSpeedImage.onload = () => {
      augmentIconImages.attackSpeed = makeChromaTransparent(attackSpeedImage);
    };
    attackSpeedImage.src = 'assets/augment-attack-speed-winged-gun-chroma.png';

    const keys = {};
    const touchMovement = {
      active: false,
      pointerId: null,
      startX: 0,
      startY: 0,
      x: 0,
      y: 0,
    };

    function clearTouchMovement() {
      touchMovement.active = false;
      touchMovement.pointerId = null;
      touchMovement.x = 0;
      touchMovement.y = 0;
    }
    let gameOver = false;
    let victory = false;
    // A last-resort guard: a rendering exception must never leave a blank canvas.
    let runtimeError = null;
    let currentStage = 1;
    let lastTime = performance.now();
    let elapsed = 0;
    let score = 0;
    let attackTimer = 0;
    const soundSettings = { bgm: true, sfx: true };
    let audioContext = null;
    let bgmTimerId = null;
    let bgmIntervalMs = 0;
    let bgmStep = 0;
    // Original synthwave battle loop: four contrasting 8-bar phrases instead
    // of the old single-note loop. The D-minor palette keeps it adventurous,
    // while the bridge briefly opens into a brighter lift before returning.
    const BGM_SECTIONS = [
      [587, 698, 880, 698, 783, 698, 659, 587, 698, 783, 880, 1047, 880, 783, 698, 659, 587, 698, 783, 880, 1175, 1047, 880, 783, 698, 783, 880, 1047, 880, 783, 698, 0],
      [523, 659, 783, 659, 698, 659, 587, 523, 659, 698, 783, 932, 783, 698, 659, 587, 523, 659, 783, 932, 1047, 932, 783, 698, 659, 783, 880, 783, 698, 659, 587, 0],
      [440, 554, 659, 783, 880, 783, 659, 554, 494, 587, 698, 880, 988, 880, 698, 587, 554, 659, 783, 988, 1175, 988, 783, 698, 659, 783, 880, 1047, 880, 783, 698, 0],
      [587, 698, 880, 1047, 1175, 1047, 880, 783, 698, 783, 932, 1175, 1047, 932, 783, 698, 659, 783, 880, 1047, 1319, 1175, 1047, 880, 783, 880, 1047, 1175, 1047, 880, 783, 0],
    ];
    const BGM_ROOTS = [73.42, 87.31, 98, 82.41, 73.42, 87.31, 110, 98, 65.41, 82.41, 98, 87.31, 73.42, 87.31, 110, 98];
    const BGM_CHORDS = [
      [146.83, 174.61, 220], [174.61, 220, 261.63], [196, 246.94, 293.66], [164.81, 196, 246.94],
      [146.83, 174.61, 220], [174.61, 220, 261.63], [220, 261.63, 329.63], [196, 246.94, 293.66],
      [130.81, 164.81, 196], [164.81, 207.65, 246.94], [196, 246.94, 293.66], [174.61, 220, 261.63],
      [146.83, 174.61, 220], [174.61, 220, 261.63], [220, 261.63, 329.63], [196, 246.94, 293.66],
    ];

    function ensureAudio() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioContext = new AudioContextClass();
      }
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function createTone(frequency, duration, volume, type = 'sine', startTime) {
      if (!frequency || frequency <= 0) return;
      const audio = ensureAudio();
      if (!audio) return;
      const start = startTime ?? audio.currentTime;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function createKick(volume, startTime) {
      const audio = ensureAudio();
      if (!audio) return;
      const start = startTime ?? audio.currentTime;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(155, start);
      oscillator.frequency.exponentialRampToValueAtTime(48, start + 0.12);
      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.14);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + 0.16);
    }

    function createNoiseBurst(duration, volume, startTime) {
      const audio = ensureAudio();
      if (!audio) return;
      const start = startTime ?? audio.currentTime;
      const buffer = audio.createBuffer(1, Math.ceil(audio.sampleRate * duration), audio.sampleRate);
      const samples = buffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
      const source = audio.createBufferSource();
      const filter = audio.createBiquadFilter();
      const gain = audio.createGain();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(1800, start);
      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      source.buffer = buffer;
      source.connect(filter).connect(gain).connect(audio.destination);
      source.start(start);
    }

    function playSfx(kind) {
      if (!soundSettings.sfx) return;
      const audio = ensureAudio();
      if (!audio) return;
      if (kind === 'choice') {
        createTone(880, 0.11, 0.055, 'sine');
        createTone(1320, 0.18, 0.05, 'sine', audio.currentTime + 0.1);
      } else if (kind === 'attack') {
        createTone(760, 0.03, 0.014, 'triangle');
        createTone(1020, 0.035, 0.011, 'triangle', audio.currentTime + 0.038);
      } else if (kind === 'bossAlert') {
        for (let i = 0; i < 10; i++) {
          createTone(i % 2 === 0 ? 520 : 780, 0.13, 0.065, 'sawtooth', audio.currentTime + i * 0.14);
        }
      } else if (kind === 'fireZone') {
        createTone(78, 0.36, 0.045, 'sine');
        [150, 205, 172, 236, 188, 218].forEach((note, index) => {
          createTone(note, 0.09, 0.018, 'sawtooth', audio.currentTime + index * 0.045);
        });
      } else if (kind === 'shuriken') {
        createTone(1480, 0.04, 0.016, 'triangle');
        createTone(1220, 0.045, 0.014, 'triangle', audio.currentTime + 0.05);
        createTone(980, 0.06, 0.012, 'triangle', audio.currentTime + 0.1);
      } else if (kind === 'bossDefeat') {
        [523, 659, 784, 1047].forEach((note, index) => createTone(note, 0.24, 0.045, 'triangle', audio.currentTime + index * 0.11));
        createTone(262, 0.52, 0.035, 'sine', audio.currentTime);
      } else if (kind === 'gameOver') {
        [440, 349, 262, 196].forEach((note, index) => createTone(note, 0.3, 0.055, 'sawtooth', audio.currentTime + index * 0.16));
      } else if (kind === 'missionComplete') {
        // A compact original victory fanfare: melody, brass-like harmony,
        // bass pulse, and a final sustained chord for level-20 clears.
        const start = audio.currentTime;
        const melody = [523, 659, 784, 1047, 784, 880, 1047, 1319, 1047, 1175, 1319, 1568];
        melody.forEach((note, index) => {
          const time = start + index * 0.16;
          const isFinalNote = index === melody.length - 1;
          createTone(note, isFinalNote ? 0.8 : 0.19, 0.052, index < 7 ? 'triangle' : 'square', time);
          if (index % 2 === 0) createTone(note * 0.5, isFinalNote ? 0.68 : 0.16, 0.018, 'sine', time);
        });
        const chords = [
          [130.81, 164.81, 196], [146.83, 174.61, 220], [164.81, 207.65, 246.94], [196, 246.94, 293.66],
        ];
        chords.forEach((chord, index) => {
          const time = start + index * 0.48;
          chord.forEach((note, noteIndex) => createTone(note * 2, index === 3 ? 1.05 : 0.44, 0.012 + noteIndex * 0.004, noteIndex === 1 ? 'triangle' : 'sine', time));
          createTone(chord[0] * 0.5, 0.42, 0.038, 'triangle', time);
          createKick(0.05, time);
          if (index < 3) createNoiseBurst(0.04, 0.01, time + 0.24);
        });
        createTone(1046.5, 1.15, 0.025, 'sine', start + 1.82);
      } else {
        createTone(560, 0.06, 0.035, 'triangle');
      }
    }

    function playBgmStep() {
      if (!soundSettings.bgm || screen !== 'game') return;
      const audio = ensureAudio();
      if (!audio) return;
      const sectionLength = BGM_SECTIONS[0].length;
      const sectionIndex = Math.floor(bgmStep / sectionLength) % BGM_SECTIONS.length;
      const step = bgmStep % sectionLength;
      const note = BGM_SECTIONS[sectionIndex][step];
      const bossFight = Boolean(boss);
      const phraseStep = Math.floor(step / 8);
      const chordIndex = (sectionIndex * 4 + phraseStep) % BGM_CHORDS.length;
      const chord = BGM_CHORDS[chordIndex];
      const bass = BGM_ROOTS[chordIndex];
      const leadTypes = ['sawtooth', 'square', 'triangle', 'sawtooth'];

      // Lead melody, answering harmony and a constantly moving arpeggio.
      createTone(note, 0.095, bossFight ? 0.032 : 0.026, leadTypes[sectionIndex]);
      if (note && step % 4 === 2) createTone(note * 0.75, 0.072, 0.011, 'triangle');
      if (step % 2 === 0) createTone(chord[(step / 2) % chord.length] * 2, 0.07, 0.009, 'sine');
      if (step % 4 === 3 && note) createTone(note * 2, 0.052, 0.008, 'triangle');

      // Driving kick/bass pattern with an off-beat snare and bright hats.
      if (step % 4 === 0) {
        createKick(bossFight ? 0.055 : 0.045);
        createTone(bass, 0.24, bossFight ? 0.045 : 0.034, 'triangle');
        chord.forEach((tone, index) => createTone(tone, 0.42, 0.006 + index * 0.002, index === 1 ? 'triangle' : 'sine'));
      } else if (step % 4 === 2) {
        createNoiseBurst(0.075, bossFight ? 0.025 : 0.018);
        createTone(bass * 1.5, 0.12, 0.018, 'square');
      } else {
        createNoiseBurst(0.018, 0.0045);
      }
      if (step === 0 || step === 16) {
        createTone(chord[0] * 2, 0.52, 0.016, 'sine');
      }
      if (bossFight) {
        if (note) createTone(note * 1.5, 0.08, 0.014, 'sawtooth');
        if (step % 4 === 1) createTone(1560, 0.025, 0.01, 'square');
      }
      bgmStep += 1;
    }

    function stopBgm() {
      if (bgmTimerId) window.clearInterval(bgmTimerId);
      bgmTimerId = null;
      bgmIntervalMs = 0;
    }

    function syncBgm() {
      if (soundSettings.bgm && screen === 'game') {
        ensureAudio();
        const interval = boss ? 104 : 122;
        if (bgmTimerId && bgmIntervalMs !== interval) {
          window.clearInterval(bgmTimerId);
          bgmTimerId = null;
        }
        if (!bgmTimerId) {
          playBgmStep();
          bgmIntervalMs = interval;
          bgmTimerId = window.setInterval(playBgmStep, interval);
        }
      } else if (bgmTimerId) {
        stopBgm();
      }
    }

    const player = {
      x: WORLD_WIDTH / 2,
      y: WORLD_HEIGHT / 2,
      radius: 22 * (MOBILE_LAYOUT ? MOBILE_UNIT_SCALE : 1),
      speed: 260,
      hp: 100,
      maxHp: 100,
      color: '#f43f5e',
      exp: 0,
      expToNext: 80,
      level: 1,
      difficulty: 1,
      attackRange: 2100,
      attackVisual: 0,
      attackDirX: 0,
      attackDirY: -1,
    };

    const PROFILE_KEY = 'suOpAdventureProfileV1';
    const MAX_UPGRADE_LEVEL = 5;
    const ACHIEVEMENTS = [
      ...[5, 7, 10, 15, 20].map((target) => ({ key: `level-${target}`, group: '레벨 달성', label: `레벨 ${target} 달성`, type: 'level', target, reward: 1 })),
      ...[500, 1000, 2000, 5000, 10000].map((target) => ({ key: `enemy-${target}`, group: '몬스터 처치', label: `몬스터 ${target.toLocaleString()}마리 처치`, type: 'enemies', target, reward: 1 })),
      ...[1, 3, 5, 7, 10].map((target) => ({ key: `boss-${target}`, group: '보스 처치', label: `보스 ${target.toLocaleString()}마리 처치`, type: 'bosses', target, reward: 2 })),
    ];
    const UPGRADE_OPTIONS = [
      { key: 'attack', label: '공격력', description: '단계당 공격력 +20%' },
      { key: 'health', label: '체력', description: '단계당 최대 체력 +20' },
      { key: 'pickup', label: '아이템 획득 반경', description: '단계당 획득 반경 +15%' },
      { key: 'speed', label: '이동 속도', description: '단계당 이동 속도 +10%' },
    ];

    function loadProfile() {
      const defaults = {
        tokens: 0,
        upgrades: { attack: 0, health: 0, pickup: 0, speed: 0 },
        upgradeCycleDirections: {},
        claimed: {},
        claimedRewards: {},
        seenAchievements: null,
        stage1Cleared: false,
        stats: { maxLevel: 1, enemies: 0, bosses: 0 },
      };
      try {
        const saved = JSON.parse(localStorage.getItem(PROFILE_KEY));
        if (!saved) return defaults;
        const savedClaims = saved.claimed || {};
        const savedClaimedRewards = saved.claimedRewards || {};
        let legacyBossTokenCorrection = 0;
        const normalizedClaimedRewards = { ...savedClaimedRewards };
        Object.keys(savedClaims).forEach((key) => {
          if (!savedClaims[key]) return;
          const achievement = ACHIEVEMENTS.find((item) => item.key === key);
          if (!achievement) return;
          const received = Number(normalizedClaimedRewards[key]) || 1;
          if (achievement.reward > received) {
            legacyBossTokenCorrection += achievement.reward - received;
            normalizedClaimedRewards[key] = achievement.reward;
          }
        });
        return {
          tokens: Math.max(0, Number(saved.tokens) || 0) + legacyBossTokenCorrection,
          upgrades: {
            attack: clamp(Number(saved.upgrades?.attack) || 0, 0, MAX_UPGRADE_LEVEL),
            health: clamp(Number(saved.upgrades?.health) || 0, 0, MAX_UPGRADE_LEVEL),
            pickup: clamp(Number(saved.upgrades?.pickup) || 0, 0, MAX_UPGRADE_LEVEL),
            speed: clamp(Number(saved.upgrades?.speed) || 0, 0, MAX_UPGRADE_LEVEL),
          },
          upgradeCycleDirections: Object.fromEntries(
            ['attack', 'health', 'pickup', 'speed'].map((key) => [
              key,
              saved.upgradeCycleDirections?.[key] === 'down' ? 'down' : 'up',
            ])
          ),
          claimed: savedClaims,
          // 이전 저장 파일의 보스 업적은 누락된 1토큰을 보정한다.
          claimedRewards: normalizedClaimedRewards,
          seenAchievements: saved.seenAchievements && typeof saved.seenAchievements === 'object'
            ? saved.seenAchievements
            : null,
          needsRewardMigration: legacyBossTokenCorrection > 0,
          stage1Cleared: Boolean(saved.stage1Cleared) || Number(saved.stats?.bosses) >= 2,
          stats: {
            maxLevel: Math.max(1, Number(saved.stats?.maxLevel) || 1),
            enemies: Math.max(0, Number(saved.stats?.enemies) || 0),
            bosses: Math.max(0, Number(saved.stats?.bosses) || 0),
          },
        };
      } catch {
        return defaults;
      }
    }

    let profile = loadProfile();
    let screen = 'menu';
    let achievementScroll = 0;
    let runStats = { maxLevel: 1, enemies: 0, bosses: 0 };

    function normalizeAchievementClaims() {
      let changed = false;
      ACHIEVEMENTS.forEach((achievement) => {
        if (profile.claimed?.[achievement.key]) {
          if (profile.claimedRewards[achievement.key] !== achievement.reward) {
            profile.claimedRewards[achievement.key] = achievement.reward;
            changed = true;
          }
          return;
        }
        if (Number(profile.claimedRewards?.[achievement.key]) >= achievement.reward) {
          profile.claimed[achievement.key] = true;
          changed = true;
        }
      });
      return changed;
    }

    function saveProfile() {
      try {
        delete profile.needsRewardMigration;
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      } catch {
        // 브라우저 저장소를 사용할 수 없는 환경에서도 게임은 계속 진행한다.
      }
    }

    const profileNeedsRewardMigration = profile.needsRewardMigration;
    const profileClaimsNormalized = normalizeAchievementClaims();
    if (profileNeedsRewardMigration || profileClaimsNormalized) saveProfile();

    function isAchievementUnlocked(achievement) {
      return profile.stats[achievement.type === 'level' ? 'maxLevel' : achievement.type] >= achievement.target;
    }

    function getClaimedReward(achievement) {
      return Number(profile.claimedRewards?.[achievement.key]) || (profile.claimed[achievement.key] ? 1 : 0);
    }

    function isAchievementClaimed(achievement) {
      // `claimed` is written at the exact moment the player checks an
      // achievement. Prefer it for UI state so an old reward-history value
      // cannot leave the menu notification lit after collection.
      return Boolean(profile.claimed?.[achievement.key]) || getClaimedReward(achievement) >= achievement.reward;
    }

    function getClaimableAchievements() {
      return ACHIEVEMENTS.filter((achievement) => (
        isAchievementUnlocked(achievement) && !isAchievementClaimed(achievement)
      ));
    }

    function hasUnclaimedAchievement() {
      return getClaimableAchievements().some((achievement) => !profile.seenAchievements?.[achievement.key]);
    }

    function markAchievementsSeen() {
      if (!profile.seenAchievements) profile.seenAchievements = {};
      let changed = false;
      ACHIEVEMENTS.forEach((achievement) => {
        if (isAchievementUnlocked(achievement) && !profile.seenAchievements[achievement.key]) {
          profile.seenAchievements[achievement.key] = true;
          changed = true;
        }
      });
      if (changed) saveProfile();
    }

    // Existing profiles predate the notification state. Treat their current
    // achievements as already seen, then only light the badge for new unlocks.
    markAchievementsSeen();

    function openAchievements() {
      markAchievementsSeen();
      screen = 'achievements';
    }

    function hasAvailableUpgrade() {
      return Math.floor(profile.tokens) >= 1
        && UPGRADE_OPTIONS.some((option) => profile.upgrades[option.key] < MAX_UPGRADE_LEVEL);
    }

    function claimAchievement(achievement) {
      if (!isAchievementUnlocked(achievement) || isAchievementClaimed(achievement)) return;
      const reward = achievement.reward - getClaimedReward(achievement);
      profile.claimed[achievement.key] = true;
      profile.claimedRewards[achievement.key] = achievement.reward;
      profile.tokens += Math.max(0, reward);
      normalizeAchievementClaims();
      saveProfile();
    }

    function applyPermanentUpgrades() {

    const DIFFICULTY_TIERS = [

    ];

      return (11 + Math.max(0, player.shurikenRank - 1) * 0.5) * player.areaMult;

    function getShurikenBossDamage() {
      return SHURIKEN_BOSS_DAMAGE_BY_RANK[player.shurikenRank] || 0;
    }

    function getFireZoneDamage(rank = player.fireZoneRank) {
      const baseDamage = 15 + rank * 4;
      return baseDamage * (currentStage === 2 ? 1.15 : 1);

      return player.shieldRank * 0.1;

    function damagePlayer(amount) {

    function spawnEnemy() {
      let enemy;
      const difficulty = getDifficultySettings();
      for (let i = 0; i < 30; i++) {
        const isSnowStage = currentStage === 2;
        const sprite = isSnowStage
          ? ['frostWolf', 'iceSpirit', 'iceKnight'][Math.floor(Math.random() * 3)]
          : ['slime', 'bat', 'zombie'][Math.floor(Math.random() * 3)];
        enemy = {
          x: Math.random() * WORLD_WIDTH,
          y: Math.random() * WORLD_HEIGHT,
          radius: (isSnowStage ? 18 + Math.random() * 8 : 12 + Math.random() * 8)
            * (MOBILE_LAYOUT ? MOBILE_UNIT_SCALE : 1),
          speed: isSnowStage ? 58 + Math.random() * 62 : (70 + Math.random() * 80) * 0.9,
          hp: (14 + Math.random() * 8 + difficulty.enemyHpBonus) * (isSnowStage ? 1.1 : 1),
          color: isSnowStage ? '#c4b5fd' : (Math.random() < 0.5 ? '#3b82f6' : '#f59e0b'),
          sprite,
          rangedCooldown: sprite === 'iceSpirit' ? 3.8 + Math.random() * 2.2 : Infinity,
        };
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) > 260) break;
      }
      enemies.push(enemy);
    }

    function spawnPickup() {
      let pickup;
      for (let i = 0; i < 20; i++) {
        pickup = {
          x: Math.random() * WORLD_WIDTH,
          y: Math.random() * WORLD_HEIGHT,
          radius: 10,
          color: '#34d399',
          value: 12,
          isExp: false,
        };
        if (Math.hypot(pickup.x - player.x, pickup.y - player.y) > 240) break;
      }
      pickups.push(pickup);

    function spawnExpOrb(x, y) {
      pickups.push({

        color: '#fbbf24',
        value: 28,
        isExp: true,
      });

    function spawnBossRewards(x, y) {

          y: clamp(y, 30, WORLD_HEIGHT - 30),
          radius: 10,
          color: '#34d399',

          isBossHeal: true,

    function spawnBossExplosion(x, y, radius) {
      bossExplosions.push({
        x,
        y,
        radius,
        startedAt: performance.now() / 1000,
        duration: 0.72,
        particles: Array.from({ length: 26 }, () => {

          return {
            angle,
            distance: radius * (1.2 + Math.random() * 2.4),

        }),

    function defeatBoss() {
      if (!boss) return;
      const isFinalBoss = boss.level === 20;
      spawnBossExplosion(boss.x, boss.y, boss.radius);
      if (!isFinalBoss) spawnBossRewards(boss.x, boss.y);
      boss = null;
      bossSpawned = false;
      runStats.bosses += 1;
      profile.stats.bosses += 1;
      if (isFinalBoss && currentStage === 1) profile.stage1Cleared = true;
      saveProfile();
      if (isFinalBoss) {
        victory = true;
        gamePaused = false;
        victoryOverlayAt = performance.now() + 650;
        playSfx('missionComplete');
        stopBgm();
      } else {
        playSfx('bossDefeat');
        syncBgm();
      }
    }

    function damageBoss(amount) {
      if (!boss) return false;
      boss.hp -= amount;
      if (boss.hp <= 0) {
        defeatBoss();
        return true;
      }
      return false;
    }

    function queueBossForLevel(level) {
      if (![10, 20].includes(level) || bossMilestones.has(level)) return;
      bossMilestones.add(level);
      bossQueue.push(level);
    }

    function spawnQueuedBoss() {
      if (boss || bossQueue.length === 0) return;
      const bossLevel = bossQueue.shift();
      const difficulty = getDifficultySettings(bossLevel);
      const isChargeBoss = bossLevel === 20;
      const hp = getBossHp(bossLevel);
      const isSnowStage = currentStage === 2;
      boss = {
        x: WORLD_WIDTH / 2,
        y: WORLD_HEIGHT / 2,
        radius: 70 * (MOBILE_LAYOUT ? MOBILE_BOSS_SCALE : 1),

        damage: difficulty.bossContactDamage,
        projectileDamage: difficulty.bossProjectileDamage,

        level: bossLevel,

        chargeTimer: 0,
        chargeDirection: null,
        chargeHitPlayer: false,
        chargeCount: 0,

      };
      bossSpawned = true;
      if (bossLevel === 10 || bossLevel === 20) {
        bossAlertTimer = 2.2;
        playSfx('bossAlert');
      }
      syncBgm();
    }

    function getAvailableAugments() {
      const pool = [
        { id: 'damage', label: `화력 증폭 (${player.damageRank}/5)`, detail: '모든 피해 +20%', apply: () => { player.damageRank += 1; player.attackMult *= 1.2; } },
        { id: 'maxHp', label: `튼튼한 마음 (${player.hpRank}/5)`, detail: '최대 HP +100', apply: () => { player.hpRank += 1; player.maxHp += 100; player.hp = Math.min(player.maxHp, player.hp + 100); } },
        { id: 'attackSpeed', label: `공격 속도 강화 (${player.attackSpeedRank}/5)`, detail: '공격 속도 +15%', apply: () => { player.attackSpeedRank += 1; player.attackSpeedMult *= 1.15; } },
        { id: 'area', label: `확장 회로 (${player.areaRank}/5)`, detail: '흡수·화염·방어막 반경 +20%', apply: () => { player.areaRank += 1; player.areaMult *= 1.2; player.pickupRange *= 1.2; } },
        { id: 'pickup', label: `수집 본능 (${player.pickupRank}/5)`, detail: '아이템 흡수 반경 +100%', apply: () => { player.pickupRank += 1; player.pickupRange *= 2; } },
        { id: 'speed', label: `가벼운 몸놀림 (${player.speedRank}/5)`, detail: '이동 속도 +15%', apply: () => { player.speedRank += 1; player.speed *= 1.15; } },
        { id: 'heal', label: '즉시 회복', detail: '최대 HP의 60% 회복', apply: () => { player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.6); } },
        { id: 'pierce', label: '투사체 관통', detail: '게임당 1회 · 적을 관통', apply: () => { player.pierce = true; } },
        { id: 'extraShot', label: `투사체 증가 (${player.extraShots}/3)`, detail: '공격할 때 총알 +1', apply: () => { player.extraShots += 1; } },
        { id: 'shuriken', label: `표창 공격 (${player.shurikenRank}/3)`, detail: '5초 회전 · 3초 재사용 대기', apply: () => { if (player.shurikenRank === 0) player.shurikenCycleStart = elapsed; player.shurikenRank += 1; } },
        { id: 'fireZone', label: `불덩이 장판 (${player.fireZoneRank}/3)`, detail: `밀집 지역에 투하, 0.35초마다 ${Math.round(getFireZoneDamage(player.fireZoneRank + 1))}피해${currentStage === 2 ? ' · 설원 피해 +15%' : ''}`, apply: () => { player.fireZoneRank += 1; } },
        { id: 'shield', label: `방어막 (${player.shieldRank}/3)`, detail: `0.4초마다 ${getShieldDamage(player.shieldRank + 1)} 피해 · 피해 감소 ${(player.shieldRank + 1) * 10}%`, apply: () => { player.shieldRank += 1; } },
      ];
      return pool.filter((augment) => {
        if (augment.id === 'pierce') return !player.hasPierceAugment;
        if (augment.id === 'damage') return player.damageRank < 5;
        if (augment.id === 'maxHp') return player.hpRank < 5;
        if (augment.id === 'attackSpeed') return player.attackSpeedRank < 5;
        if (augment.id === 'area') return player.areaRank < 5 && (player.fireZoneRank > 0 || player.shieldRank > 0 || player.shurikenRank > 0);
        if (augment.id === 'pickup') return player.pickupRank < 5;
        if (augment.id === 'speed') return player.speedRank < 5;
        if (augment.id === 'heal') return player.hp / player.maxHp < 0.3;
        if (augment.id === 'extraShot') return player.extraShots < 3;
        if (augment.id === 'shuriken') return player.shurikenRank < 3;
        if (augment.id === 'fireZone') return player.fireZoneRank < 3;
        if (augment.id === 'shield') return player.shieldRank < 3;
        return true;
      });
    }

    function getRandomAugment() {
      const pool = getAvailableAugments();
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function openChoices() {
      const pool = getAvailableAugments();
      if (pool.length === 0) return;
      clearTouchMovement();
      const set = new Set();
      while (set.size < 3 && pool.length > set.size) {
        const candidate = pool[Math.floor(Math.random() * pool.length)];
        if (!candidate) break;
        set.add(candidate.id);
      }
      choices = Array.from(set).map((id) => pool.find((augment) => augment.id === id));
      choiceParticles = Array.from({ length: 72 }, () => ({
        x: 35 + Math.random() * (WIDTH - 70),
        y: 125 + Math.random() * (HEIGHT - 250),
        drift: (Math.random() - 0.5) * 90,
        rise: 45 + Math.random() * 115,
        phase: Math.random() * Math.PI * 2,
        duration: 2.5 + Math.random() * 2.5,
        size: 4 + Math.random() * 5,
      }));
      choiceOpen = true;
      paused = true;
      playSfx('choice');
    }

    function applyAugment(augment) {
      if (!augment) return;
      augment.apply();
      if (augment.id === 'pierce') player.hasPierceAugment = true;
      // Short protection while the overlay closes; intentionally no visual
      // effect so it does not overlap with the revive blink feedback.
      player.augmentInvulnerableTimer = 0.5;
      choiceOpen = false;
      paused = false;
      choices = [];
      choiceParticles = [];
    }

    function gainExp(amount) {
      // 기존 보너스에 더해 레벨 15~19 구간은 경험치를 10% 추가 지급한다.
      if (player.level >= 15 && player.level < 20) amount *= 1.32;
      player.exp += amount;
      while (player.exp >= player.expToNext) {
        player.exp -= player.expToNext;
        player.level += 1;
        runStats.maxLevel = Math.max(runStats.maxLevel, player.level);
        profile.stats.maxLevel = Math.max(profile.stats.maxLevel, player.level);
        saveProfile();
        player.expToNext = Math.floor(player.expToNext * 1.35);
        player.difficulty = getDifficultyTier() + 1;
        player.speed += 6;
        if (player.level === 20) {
          enemies.length = 0;
          attacks.length = 0;
          boss = null;
          bossSpawned = false;
          bossQueue.length = 0;
        }
        queueBossForLevel(player.level);
        spawnQueuedBoss();
        openChoices();
        if (player.level >= 20) break;
      }
    }

    function spawnAttack() {
      playSfx('attack');
      let target = null;
      let bestDistance = Infinity;

      enemies.forEach((enemy) => {
        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist < bestDistance) {
          bestDistance = dist;
          target = enemy;
        }
      });
      if (boss) {
        const bossDistance = Math.hypot(player.x - boss.x, player.y - boss.y);
        if (bossDistance < bestDistance) {
          bestDistance = bossDistance;
          target = boss;
        }
      }

      let dirX = 0;
      let dirY = -1;
      if (target && bestDistance < player.attackRange) {
        dirX = target.x - player.x;
        dirY = target.y - player.y;
        const length = Math.hypot(dirX, dirY) || 1;
        dirX /= length;
        dirY /= length;
      }

      player.attackVisual = 0.18;
      player.attackDirX = dirX;
      player.attackDirY = dirY;

      const shots = 1 + (player.extraShots || 0);
      for (let i = 0; i < shots; i++) {
        const angleOffset = (i - (shots - 1) / 2) * 0.12;
        const angle = Math.atan2(dirY, dirX) + angleOffset;
        attacks.push({
          x: player.x,
          y: player.y,
          radius: 8,
          vx: Math.cos(angle) * (480 * (player.attackMult || 1)),
          vy: Math.sin(angle) * (480 * (player.attackMult || 1)),
          life: player.attackRange / (480 * (player.attackMult || 1)),
          color: '#fb7185',
          pierce: player.pierce || false,
          owner: 'player',
        });
      }
    }

    function spawnFireZone() {
      if ((enemies.length === 0 && !boss) || player.fireZoneRank === 0 || fireZones.length > 0) return;
      const candidates = (boss ? [boss, ...enemies] : enemies)
        .slice()
        .sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y))
        .slice(0, Math.min(14, enemies.length + (boss ? 1 : 0)));
      let target = candidates[0];
      if (!target) return;
      let bestScore = -Infinity;
      candidates.forEach((candidate) => {
        const density = enemies.filter((enemy) => Math.hypot(enemy.x - candidate.x, enemy.y - candidate.y) < 155).length;
        const distance = Math.hypot(candidate.x - player.x, candidate.y - player.y);
        const score = density * 120 - distance * 0.12 + Math.random() * 150;
        if (score > bestScore) {
          bestScore = score;
          target = candidate;
        }
      });
      const radius = (56 + (player.fireZoneRank - 1) * 24) * player.areaMult;
      const targetX = clamp(target.x + (Math.random() - 0.5) * 60, radius, WORLD_WIDTH - radius);
      const targetY = clamp(target.y + (Math.random() - 0.5) * 60, radius, WORLD_HEIGHT - radius);
      const distance = Math.hypot(targetX - player.x, targetY - player.y);
      fireZones.push({
        state: 'throwing',
        x: player.x,
        y: player.y,
        startX: player.x,
        startY: player.y,
        targetX,
        targetY,
        travel: 0,
        travelDuration: clamp(distance / 760, 0.28, 0.72),
        radius,
        life: 4.5,
        tickTimer: 0,
      });
    }

    function updateCombatAugments(delta) {
      const shurikenCount = player.shurikenRank > 0 ? player.shurikenRank + 1 : 0;
      const shurikenActiveDuration = 3 + player.shurikenRank * 2;
      const shurikenCycleDuration = shurikenActiveDuration + 3;
      const shurikenActive = (elapsed - player.shurikenCycleStart) % shurikenCycleDuration < shurikenActiveDuration;
      if (shurikenCount > 0 && shurikenActive && !shurikenSoundActive) playSfx('shuriken');
      shurikenSoundActive = shurikenCount > 0 && shurikenActive;
      shurikens.length = shurikenCount;
      for (let i = 0; i < shurikenCount; i++) {
        const angle = elapsed * 5 + (i / shurikenCount) * Math.PI * 2;
        const orbitRadius = getShurikenOrbitRadius();
        const shuriken = shurikens[i] || {};
        shuriken.x = player.x + Math.cos(angle) * orbitRadius;
        shuriken.y = player.y + Math.sin(angle) * orbitRadius;
        shuriken.angle = angle;
        shuriken.radius = getShurikenHitRadius();
        shuriken.active = shurikenActive;
        shuriken.bossHitCooldown = Math.max(0, (shuriken.bossHitCooldown || 0) - delta);
        shurikens[i] = shuriken;
        if (!shurikenActive) continue;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (Math.hypot(shuriken.x - enemy.x, shuriken.y - enemy.y) < shuriken.radius + enemy.radius) defeatEnemy(j);
        }
        if (boss && shuriken.bossHitCooldown <= 0 && Math.hypot(shuriken.x - boss.x, shuriken.y - boss.y) < shuriken.radius + boss.radius) {
          damageBoss(getShurikenBossDamage() * player.attackMult);
          shuriken.bossHitCooldown = 0.5;
        }
      }

      if (player.fireZoneRank > 0 && fireZones.length === 0) {
        fireZoneTimer += delta;
        if (fireZoneTimer >= 0.55) {
          fireZoneTimer = 0;
          spawnFireZone();
        }
      }
      for (let i = fireZones.length - 1; i >= 0; i--) {
        const zone = fireZones[i];
        if (zone.state === 'throwing') {
          zone.travel += delta;
          const progress = Math.min(1, zone.travel / zone.travelDuration);
          zone.x = zone.startX + (zone.targetX - zone.startX) * progress;
          zone.y = zone.startY + (zone.targetY - zone.startY) * progress;
          if (progress >= 1) {
            zone.state = 'active';
            zone.x = zone.targetX;
            zone.y = zone.targetY;
            zone.tickTimer = 0;
            playSfx('fireZone');
          }
          continue;
        }
        zone.life -= delta;
        zone.tickTimer += delta;
        if (zone.life <= 0) {
          fireZones.splice(i, 1);
          continue;
        }
        if (zone.tickTimer < 0.35) continue;
        zone.tickTimer = 0;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (Math.hypot(zone.x - enemy.x, zone.y - enemy.y) < zone.radius + enemy.radius) {
            enemy.hp -= getFireZoneDamage() * player.attackMult;
            if (enemy.hp <= 0) defeatEnemy(j);
          }
        }
        if (boss && Math.hypot(zone.x - boss.x, zone.y - boss.y) < zone.radius + boss.radius) {
          damageBoss(getFireZoneDamage() * player.attackMult);
        }
      }

      if (player.shieldRank > 0) {
        shieldTickTimer += delta;
        if (shieldTickTimer >= 0.4) {
          shieldTickTimer = 0;
          const shieldRadius = getShieldRadius();
          for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < shieldRadius + enemy.radius) {
              enemy.hp -= getShieldDamage() * player.attackMult;
              if (enemy.hp <= 0) defeatEnemy(j);
            }
          }
          if (boss && Math.hypot(player.x - boss.x, player.y - boss.y) < shieldRadius + boss.radius) {
            damageBoss(getShieldDamage() * player.attackMult);
          }
        }
      } else {
        shieldTickTimer = 0;
      }
    }

    function moveBossTowardPlayer(delta, activeBoss = boss) {
      if (!activeBoss) return;
      const dx = player.x - activeBoss.x;
      const dy = player.y - activeBoss.y;
      const distance = Math.hypot(dx, dy);
      if (distance > 20) {
        activeBoss.x += (dx / distance) * Math.min(activeBoss.speed * delta, distance);
        activeBoss.y += (dy / distance) * Math.min(activeBoss.speed * delta, distance);
      }
    }

    function fireBossMissiles(activeBoss = boss) {
      if (!activeBoss) return;
      const isLevelTwenty = activeBoss.level === 20;
      const missileCount = isLevelTwenty ? 11 : 16;
      const missileSpeed = isLevelTwenty ? 390 : 270;
      const baseAngle = isLevelTwenty
        ? Math.atan2(player.y - activeBoss.y, player.x - activeBoss.x)
        : Math.random() * Math.PI * 2;
      for (let i = 0; i < missileCount; i++) {
        const angle = isLevelTwenty
          ? baseAngle + (i - (missileCount - 1) / 2) * 0.115
          : baseAngle + (i / missileCount) * Math.PI * 2;
        attacks.push({
          x: activeBoss.x,
          y: activeBoss.y,
          radius: isLevelTwenty ? 12 : 10,
          vx: Math.cos(angle) * missileSpeed,
          vy: Math.sin(angle) * missileSpeed,
          damage: activeBoss.projectileDamage,
          life: 3.0,
          color: '#fb7185',
          owner: 'boss',
        });
      }
    }

    function fireIceBolt(enemy) {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const distance = Math.hypot(dx, dy) || 1;
      attacks.push({
        x: enemy.x,
        y: enemy.y,
        radius: 10 * (MOBILE_LAYOUT ? MOBILE_UNIT_SCALE : 1),
        vx: (dx / distance) * 220,
        vy: (dy / distance) * 220,
        damage: 12,
        life: 2.4 * (MOBILE_LAYOUT ? MOBILE_UNIT_SCALE : 1),
        color: '#a5f3fc',
        owner: 'enemy',
        style: 'iceBolt',
      });
    }

    function triggerRockStrike(activeBoss = boss) {
      if (!activeBoss) return;
      const count = 3 + Math.floor(Math.random() * 2);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const distance = 95 + Math.random() * 190;
        bossStrikeZones.push({
          x: clamp(player.x + Math.cos(angle) * distance, 70, WORLD_WIDTH - 70),
          y: clamp(player.y + Math.sin(angle) * distance, 70, WORLD_HEIGHT - 70),
          radius: 54 + Math.random() * 12,
          timer: 1.35,
          duration: 1.35,
          beepTimer: 0.22,
        });
      }
      activeBoss.slamCooldown = 8.5 + Math.random() * 2.5;
      activeBoss.slamPunchTimer = 0.55;
      playSfx('bossAlert');
    }

    function updateBossBehavior(delta) {
      if (!boss) return;
      const activeBoss = boss;
      if (!['idle', 'prepare', 'charge'].includes(activeBoss.chargeState)) activeBoss.chargeState = 'idle';
      if (!Number.isFinite(activeBoss.chargeTimer)) activeBoss.chargeTimer = 0;
      if (activeBoss.isChargeBoss && !Number.isFinite(activeBoss.chargeCooldown)) activeBoss.chargeCooldown = 4.5;
      if (!Number.isFinite(activeBoss.cooldown)) activeBoss.cooldown = 2.5;
      if (!Number.isFinite(activeBoss.chargeCount)) activeBoss.chargeCount = 0;
      if (currentStage === 2 && activeBoss.level === 20 && !Number.isFinite(activeBoss.slamCooldown)) {
        activeBoss.slamCooldown = 7.5;
      }
      activeBoss.slamPunchTimer = Math.max(0, (activeBoss.slamPunchTimer || 0) - delta);
      if (!activeBoss.isChargeBoss || activeBoss.chargeState === 'idle') {
        moveBossTowardPlayer(delta, activeBoss);
      }

      if (activeBoss.isChargeBoss) {
        if (activeBoss.chargeState === 'idle') {
          activeBoss.chargeCooldown -= delta;
          if (activeBoss.chargeCooldown <= 0) {
            activeBoss.chargeState = 'prepare';
            activeBoss.chargeTimer = 1;
            activeBoss.chargeDirection = null;
            activeBoss.chargeCount = 1;
          }
        } else if (activeBoss.chargeState === 'prepare') {
          activeBoss.chargeTimer -= delta;
          if (!activeBoss.chargeDirection && activeBoss.chargeTimer <= 0.5) {
            const dx = player.x - activeBoss.x;
            const dy = player.y - activeBoss.y;
            const distance = Math.hypot(dx, dy) || 1;
            activeBoss.chargeDirection = { x: dx / distance, y: dy / distance };
          }
          if (activeBoss.chargeTimer <= 0) {
            activeBoss.chargeState = 'charge';
            activeBoss.chargeTimer = 0.55;
            activeBoss.chargeHitPlayer = false;
          }
        } else if (activeBoss.chargeState === 'charge') {
          if (!activeBoss.chargeDirection || !Number.isFinite(activeBoss.chargeDirection.x) || !Number.isFinite(activeBoss.chargeDirection.y)) {
            activeBoss.chargeState = 'prepare';
            activeBoss.chargeTimer = 0.35;
            activeBoss.chargeDirection = null;
            return;
          }
          const chargeSpeed = currentStage === 2 ? 1220 : 1100;
          activeBoss.x = clamp(activeBoss.x + activeBoss.chargeDirection.x * chargeSpeed * delta, activeBoss.radius, WORLD_WIDTH - activeBoss.radius);
          activeBoss.y = clamp(activeBoss.y + activeBoss.chargeDirection.y * chargeSpeed * delta, activeBoss.radius, WORLD_HEIGHT - activeBoss.radius);
          activeBoss.chargeTimer -= delta;
          if (activeBoss.chargeTimer <= 0) {
            if (currentStage === 2 && activeBoss.chargeCount < 2) {
              activeBoss.chargeCount += 1;
              activeBoss.chargeState = 'prepare';
              activeBoss.chargeTimer = 0.48;
              activeBoss.chargeDirection = null;
            } else {
              activeBoss.chargeState = 'idle';
              activeBoss.chargeCooldown = 6.5;
              activeBoss.chargeDirection = null;
            }
          }
        }
      }

      if (currentStage === 2 && activeBoss.level === 20 && activeBoss.chargeState !== 'charge') {
        activeBoss.slamCooldown -= delta;
        if (activeBoss.slamCooldown <= 0) triggerRockStrike(activeBoss);
      }

      // Projectile attacks run independently of dash preparation. This keeps
      // the level 20 boss threatening even when it is about to charge.
      if (activeBoss.chargeState !== 'charge') {
        activeBoss.cooldown -= delta;
        if (activeBoss.cooldown <= 0) {
          activeBoss.cooldown = activeBoss.level === 20 ? 2.7 + Math.random() * 1.4 : 3 + Math.random() * 7;
          fireBossMissiles(activeBoss);
        }
      }
    }

    function updateRockStrikes(delta) {
      for (let i = bossStrikeZones.length - 1; i >= 0; i--) {
        const zone = bossStrikeZones[i];
        zone.timer -= delta;
        zone.beepTimer -= delta;
        if (zone.beepTimer <= 0 && zone.timer > 0) {
          zone.beepTimer = 0.25;
          // The original meteor cue plays once when the boss slams. Do not
          // stack it again for every target circle during the warning phase.
        }
        if (zone.timer > 0) continue;
        if (Math.hypot(player.x - zone.x, player.y - zone.y) < player.radius + zone.radius) {
          damagePlayer((boss?.projectileDamage || 28) * 1.35);
        }
        rockImpacts.push({ x: zone.x, y: zone.y, radius: zone.radius, timer: 0.5, duration: 0.5 });
        bossStrikeZones.splice(i, 1);
      }
      for (let i = rockImpacts.length - 1; i >= 0; i--) {
        rockImpacts[i].timer -= delta;
        if (rockImpacts[i].timer <= 0) rockImpacts.splice(i, 1);
      }
    }

    function update(delta) {
      if (screen !== 'game' || gameOver || victory || paused || gamePaused) return;

      if (!boss) spawnQueuedBoss();

      elapsed += delta;
      player.invulnerableTimer = Math.max(0, (player.invulnerableTimer || 0) - delta);
      player.augmentInvulnerableTimer = Math.max(0, (player.augmentInvulnerableTimer || 0) - delta);
      player.attackVisual = Math.max(0, (player.attackVisual || 0) - delta);
      bossAlertTimer = Math.max(0, bossAlertTimer - delta);

      const moveX = (keys['ArrowRight'] ? 1 : 0) - (keys['ArrowLeft'] ? 1 : 0) + (touchMovement.active ? touchMovement.x : 0);
      const moveY = (keys['ArrowDown'] ? 1 : 0) - (keys['ArrowUp'] ? 1 : 0) + (touchMovement.active ? touchMovement.y : 0);
      const length = Math.hypot(moveX, moveY) || 1;
      player.x += (moveX / length) * player.speed * delta;
      player.y += (moveY / length) * player.speed * delta;
      player.x = clamp(player.x, player.radius, WORLD_WIDTH - player.radius);
      player.y = clamp(player.y, player.radius, WORLD_HEIGHT - player.radius);

      camera.x = clamp(player.x - WIDTH / 2, 0, WORLD_WIDTH - WIDTH);
      camera.y = clamp(player.y - HEIGHT / 2, 0, WORLD_HEIGHT - HEIGHT);

      attackTimer += delta;
      if (attackTimer >= 0.28 / player.attackSpeedMult) {
        attackTimer = 0;
        spawnAttack();
      }

      if (boss) {
        updateBossBehavior(delta);
        updateRockStrikes(delta);
        const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
        if (dist < player.radius + boss.radius) {
          if (boss.chargeState === 'charge') {
            if (!boss.chargeHitPlayer) {
              damagePlayer((boss.damage || 40) * 2.5);
              boss.chargeHitPlayer = true;
            }
          } else {
            damagePlayer((boss.damage || 40) * delta * 0.7);
          }
          if (player.hp <= 0) {
            triggerGameOver();
            return;
          }
        }
      }

      for (let i = attacks.length - 1; i >= 0; i--) {
        const atk = attacks[i];
        atk.life -= delta;
        atk.x += atk.vx * delta;
        atk.y += atk.vy * delta;
        if (atk.life <= 0 || atk.x < -50 || atk.x > WORLD_WIDTH + 50 || atk.y < -50 || atk.y > WORLD_HEIGHT + 50) {
          attacks.splice(i, 1);
          continue;
        }

        if (atk.owner === 'enemy' && player.shieldRank > 0 && !atk.shieldBlockChecked) {
          const shieldRadius = getShieldRadius();
          if (Math.hypot(atk.x - player.x, atk.y - player.y) < atk.radius + shieldRadius) {
            // A projectile gets one block roll as it crosses the shield. A
            // failed roll must not repeat every frame while it travels inward.
            atk.shieldBlockChecked = true;
            if (Math.random() < getShieldProjectileBlockChance()) {
              attacks.splice(i, 1);
              continue;
            }
          }
        }

        if (atk.owner === 'boss' || atk.owner === 'enemy') {
          if (Math.hypot(atk.x - player.x, atk.y - player.y) < atk.radius + player.radius) {
            damagePlayer(atk.damage);
            attacks.splice(i, 1);
            if (player.hp <= 0) triggerGameOver();
          }
          continue;
        }

        if (boss) {
          const dist = Math.hypot(atk.x - boss.x, atk.y - boss.y);
          if (dist < atk.radius + boss.radius) {
            const bossDefeated = damageBoss(27 * (player.attackMult || 1));
            if (!atk.pierce) attacks.splice(i, 1);
            if (bossDefeated) return;
            continue;
          }
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          const dist = Math.hypot(atk.x - enemy.x, atk.y - enemy.y);
          if (dist < atk.radius + enemy.radius) {
            enemy.hp -= 24 * (player.attackMult || 1);
            if (!atk.pierce) attacks.splice(i, 1);
            if (enemy.hp <= 0) {
              defeatEnemy(j);
            }
            break;
          }
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.hypot(dx, dy);
        const dirX = dist ? dx / dist : 0;
        const dirY = dist ? dy / dist : 0;
        if (enemy.sprite === 'iceSpirit') {
          enemy.rangedCooldown -= delta;
          if (dist < 520 && enemy.rangedCooldown <= 0) {
            fireIceBolt(enemy);
            enemy.rangedCooldown = 4.2 + Math.random() * 2.2;
          }
        }
        enemy.x += dirX * enemy.speed * delta;
        enemy.y += dirY * enemy.speed * delta;

        if (dist < player.radius + enemy.radius) {
          const contactDamage = getDifficultySettings().enemyContactDamage;
          damagePlayer(contactDamage * delta * 60);
          if (player.hp <= 0) {
            triggerGameOver();
            return;
          }
        }
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const pickup = pickups[i];
        const pickupRadius = (player.pickupRange || 1) * 28 + 6;
        const dist = Math.hypot(player.x - pickup.x, player.y - pickup.y);
        if (dist < player.radius + pickup.radius + pickupRadius && !pickup.sucked) {
          pickup.sucked = true;
          pickup.suckPhase = 'bounce';
          pickup.startX = pickup.x;
          pickup.startY = pickup.y;
          let awayX = pickup.x - player.x;
          let awayY = pickup.y - player.y;
          let awayLength = Math.hypot(awayX, awayY);
          if (awayLength < 0.01) {
            const angle = Math.random() * Math.PI * 2;
            awayX = Math.cos(angle);
            awayY = Math.sin(angle);
            awayLength = 1;
          }
          pickup.bounceX = pickup.x + (awayX / awayLength) * 24;
          pickup.bounceY = pickup.y + (awayY / awayLength) * 24;
          pickup.suckTimer = 0;
          pickup.suckDuration = 0.14;
          pickup.visualAlpha = 1;
        }
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const pickup = pickups[i];
        if (!pickup.sucked) continue;
        pickup.suckTimer += delta;
        const duration = pickup.suckDuration || 0.14;
        const t = Math.min(1, pickup.suckTimer / duration);
        if (pickup.suckPhase === 'bounce') {
          const eased = 1 - Math.pow(1 - t, 2);
          pickup.x = pickup.startX + (pickup.bounceX - pickup.startX) * eased;
          pickup.y = pickup.startY + (pickup.bounceY - pickup.startY) * eased;
          if (t >= 1) {
            pickup.suckPhase = 'absorbing';
            pickup.startX = pickup.x;
            pickup.startY = pickup.y;
            pickup.suckTimer = 0;
            pickup.suckDuration = 0.34;
          }
          continue;
        }
        const eased = 1 - Math.pow(1 - t, 3);
        pickup.x = pickup.startX + (player.x - pickup.startX) * eased;
        pickup.y = pickup.startY + (player.y - pickup.startY) * eased;
        pickup.visualAlpha = 1 - t * 0.35;
        pickup.collectScale = 1 - t * 0.72;
        if (t >= 1) {
          pickups.splice(i, 1);
          if (pickup.isBossHeal) {
            player.hp = player.maxHp;
          } else if (pickup.isBossAugment) {
            openChoices();
          } else if (pickup.isExp) {
            gainExp(pickup.value);
          } else {
            player.hp = Math.min(player.maxHp, player.hp + pickup.value);
          }
        }
      }

      const spawnChance = getDifficultySettings().spawnChance;
      if (player.level < 20 && elapsed > 8 && Math.random() < spawnChance) spawnEnemy();
      updateCombatAugments(delta);
    }

    function drawBackground() {
      if (currentStage === 2 && snowBackgroundImage.complete && snowBackgroundImage.naturalWidth) {
        const tileSize = 760;
        const startX = Math.floor(camera.x / tileSize) * tileSize - tileSize;
        const startY = Math.floor(camera.y / tileSize) * tileSize - tileSize;
        const endX = camera.x + WIDTH + tileSize;
        const endY = camera.y + HEIGHT + tileSize;
        ctx.fillStyle = '#182744';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.save();
        ctx.globalAlpha = 0.94;
        ctx.translate(-camera.x, -camera.y);
        for (let x = startX; x <= endX; x += tileSize) {
          for (let y = startY; y <= endY; y += tileSize) {
            ctx.drawImage(snowBackgroundImage, x, y, tileSize, tileSize);
          }
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(8, 16, 37, 0.16)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        return;
      }
      const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      grad.addColorStop(0, '#0d3a4d');
      grad.addColorStop(1, '#092f41');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const tileSize = 120;
      const startX = Math.floor(camera.x / tileSize) * tileSize - tileSize;
      const startY = Math.floor(camera.y / tileSize) * tileSize - tileSize;
      const endX = camera.x + WIDTH + tileSize;
      const endY = camera.y + HEIGHT + tileSize;
      ctx.save();
      ctx.translate(-camera.x, -camera.y);
      for (let x = startX; x <= endX; x += tileSize) {
        for (let y = startY; y <= endY; y += tileSize) {
          const cellX = Math.floor(x / tileSize);
          const cellY = Math.floor(y / tileSize);
          const seed = Math.abs(Math.sin(cellX * 12.9898 + cellY * 78.233) * 43758.5453) % 1;
          ctx.fillStyle = seed > 0.52 ? '#12485a' : '#103f52';
          ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
          ctx.strokeStyle = 'rgba(5, 31, 45, 0.58)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
          ctx.fillStyle = 'rgba(137, 212, 218, 0.14)';
          ctx.fillRect(x + 8, y + 8, tileSize - 16, 2);

          if (seed > 0.78) {
            ctx.fillStyle = 'rgba(5, 36, 48, 0.48)';
            ctx.fillRect(x + 44, y + 39, 32, 42);
            ctx.fillStyle = 'rgba(111, 188, 195, 0.28)';
            for (let line = 0; line < 4; line++) ctx.fillRect(x + 50, y + 46 + line * 8, 20, 2);
          } else if (seed < 0.12) {
            ctx.strokeStyle = 'rgba(118, 203, 205, 0.26)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x + 60, y + 60, 19, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        if (player.hp <= 0) {
          triggerGameOver();
          return;
        }
      }
      ctx.restore();
    }

    function drawSprite(sprite, worldX, worldY, size, rotation = 0) {
      const asset = SPRITE_ASSETS[sprite];
      const image = spriteImages[sprite];
      if (!asset || !image || !(image.naturalWidth || image.width)) return false;
      const [cropX, cropY, cropWidth, cropHeight] = asset.crop;
      const sourceX = image.width * cropX;
      const sourceY = image.height * cropY;
      const sourceWidth = image.width * cropWidth;
      const sourceHeight = image.height * cropHeight;
      const drawWidth = size;
      const drawHeight = size * (sourceHeight / sourceWidth);
      if (rotation) {
        ctx.save();
        ctx.translate(worldX - camera.x, worldY - camera.y);
        ctx.rotate(rotation);
        ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();
      } else {
        ctx.drawImage(
          image,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          worldX - camera.x - drawWidth / 2,
          worldY - camera.y - drawHeight / 2,
          drawWidth,
          drawHeight,
        );
      }
      return true;
    }

    function drawPlayer() {
      const attackProgress = Math.max(0, Math.min(1, (player.attackVisual || 0) / 0.18));
      const attackPulse = Math.sin(attackProgress * Math.PI);
      const visualX = player.x + (player.attackDirX || 0) * attackPulse * 5;
      const visualY = player.y + (player.attackDirY || 0) * attackPulse * 5;
      const lean = (player.attackDirX || 0) * attackPulse * 0.08;
      const reviveBlinkAlpha = player.invulnerableTimer > 0
        ? (Math.floor(performance.now() / 105) % 2 === 0 ? 1 : 0.18)
        : 1;

      ctx.save();
      ctx.globalAlpha = reviveBlinkAlpha;
      if (!drawSprite('player', visualX, visualY, player.radius * 2.2, lean)) {
        ctx.save();
        ctx.translate(visualX - camera.x, visualY - camera.y);
        ctx.rotate(lean);
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(3, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(4, -4, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      const barY = player.y - camera.y + player.radius + 18;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(player.x - camera.x - 30, barY, 60, 8);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(player.x - camera.x - 30, barY, 60 * (player.hp / player.maxHp), 8);
    }

    function drawEnemies() {
      enemies.forEach((enemy) => {
        if (drawSprite(enemy.sprite, enemy.x, enemy.y, enemy.radius * 2.2)) return;
        ctx.save();
        ctx.translate(enemy.x - camera.x, enemy.y - camera.y);
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-4, -8, 8, 16);
        ctx.restore();
      });
    }

    function drawPickupGem(pickup) {
      const radius = pickup.radius * 0.715;
      const baseColor = pickup.isExp ? '#fbbf24' : '#34d399';
      const brightColor = pickup.isExp ? '#fef3c7' : '#d1fae5';
      const darkColor = pickup.isExp ? '#b45309' : '#047857';
      ctx.shadowColor = baseColor;
      ctx.shadowBlur = 11;
      ctx.fillStyle = '#071827';
      ctx.beginPath();
      ctx.moveTo(0, -radius - 3);
      ctx.lineTo(radius + 3, 0);
      ctx.lineTo(0, radius + 3);
      ctx.lineTo(-radius - 3, 0);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.moveTo(0, -radius);
      ctx.lineTo(radius, 0);
      ctx.lineTo(0, radius);
      ctx.lineTo(-radius, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = brightColor;
      ctx.beginPath();
      ctx.moveTo(0, -radius);
      ctx.lineTo(0, radius);
      ctx.lineTo(-radius, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = darkColor;
      ctx.beginPath();
      ctx.moveTo(0, radius);
      ctx.lineTo(radius, 0);
      ctx.lineTo(0, -radius);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.beginPath();
      ctx.moveTo(-radius * 0.38, -radius * 0.1);
      ctx.lineTo(-radius * 0.05, -radius * 0.58);
      ctx.lineTo(radius * 0.12, -radius * 0.2);
      ctx.closePath();
      ctx.fill();
    }

    function drawPickups() {
      pickups.forEach((pickup) => {
        ctx.save();
        ctx.translate(pickup.x - camera.x, pickup.y - camera.y);
        if (pickup.sucked) ctx.globalAlpha = pickup.visualAlpha ?? 0;
        const visualScale = (pickup.displayScale || 1) * (pickup.collectScale || 1);
        ctx.scale(visualScale, visualScale);
        drawPickupGem(pickup);
        ctx.restore();
      });
    }

    function defeatEnemy(index) {
      const enemy = enemies[index];
      if (!enemy) return;
      enemies.splice(index, 1);
      score += 10;
      runStats.enemies += 1;
      profile.stats.enemies += 1;
      saveProfile();
      if (Math.random() < 0.001) spawnPickup();
      if (Math.random() < 0.325) spawnExpOrb(enemy.x, enemy.y);
      if (enemies.length < getDifficultySettings().enemyTargetCount) spawnEnemy();
    }

    function drawFireZones() {
      fireZones.forEach((zone) => {
        ctx.save();
        if (zone.state === 'throwing') {
          const progress = Math.min(1, zone.travel / zone.travelDuration);
          const arcHeight = Math.sin(progress * Math.PI) * 76;
          ctx.translate(zone.x - camera.x, zone.y - camera.y - arcHeight);
          const trailX = -((zone.targetX - zone.startX) / Math.max(1, Math.hypot(zone.targetX - zone.startX, zone.targetY - zone.startY))) * 16;
          const trailY = -((zone.targetY - zone.startY) / Math.max(1, Math.hypot(zone.targetX - zone.startX, zone.targetY - zone.startY))) * 16;
          const trail = ctx.createLinearGradient(trailX, trailY, 0, 0);
          trail.addColorStop(0, 'rgba(239, 68, 68, 0)');
          trail.addColorStop(1, 'rgba(251, 146, 60, 0.85)');
          ctx.strokeStyle = trail;
          ctx.lineWidth = 9;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(trailX, trailY);
          ctx.lineTo(0, 0);
          ctx.stroke();
          ctx.shadowColor = '#fb923c';
          ctx.shadowBlur = 18;
          const flame = ctx.createRadialGradient(-4, -5, 2, 0, 0, 15);
          flame.addColorStop(0, '#fef3c7');
          flame.addColorStop(0.4, '#f97316');
          flame.addColorStop(1, '#dc2626');
          ctx.fillStyle = flame;
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }
        ctx.translate(zone.x - camera.x, zone.y - camera.y);
        const gradient = ctx.createRadialGradient(0, 0, zone.radius * 0.15, 0, 0, zone.radius);
        gradient.addColorStop(0, 'rgba(254, 240, 138, 0.95)');
        gradient.addColorStop(0.42, 'rgba(249, 115, 22, 0.72)');
        gradient.addColorStop(1, 'rgba(220, 38, 38, 0.12)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, zone.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(251, 146, 60, 0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, zone.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawShurikens() {
      shurikens.forEach((shuriken) => {
        if (!shuriken.active) return;
        ctx.save();
        ctx.translate(shuriken.x - camera.x, shuriken.y - camera.y);
        ctx.rotate(shuriken.angle * 2);
        ctx.shadowColor = '#cbd5e1';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const radius = i % 2 === 0 ? shuriken.radius + 5 : shuriken.radius * 0.42;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const radius = i % 2 === 0 ? shuriken.radius + 1 : shuriken.radius * 0.38;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.arc(0, 0, shuriken.radius * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawShield() {
      if (player.shieldRank === 0) return;

      ctx.strokeStyle = 'rgba(103, 232, 249, 0.72)';
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = 12;
      for (let i = 0; i < player.shieldRank; i++) {
        ctx.globalAlpha = 1 - i * 0.16;
        ctx.lineWidth = 4 - i * 0.45;
        ctx.setLineDash([10, 7]);
        ctx.lineDashOffset = -elapsed * (30 + i * 8);
        ctx.beginPath();

      }
      ctx.restore();

    function drawBossExplosions() {
      const now = performance.now() / 1000;
      for (let i = bossExplosions.length - 1; i >= 0; i--) {
        const explosion = bossExplosions[i];
        const progress = Math.min(1, (now - explosion.startedAt) / explosion.duration);
        if (progress >= 1) {
          bossExplosions.splice(i, 1);
          continue;
        }
        const alpha = 1 - progress;
        ctx.save();
        ctx.translate(explosion.x - camera.x, explosion.y - camera.y);
        const coreRadius = explosion.radius * (0.55 + progress * 1.25);
        const core = ctx.createRadialGradient(0, 0, 0, 0, 0, coreRadius);
        core.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        core.addColorStop(0.35, `rgba(253, 224, 71, ${alpha * 0.9})`);
        core.addColorStop(1, `rgba(244, 63, 94, 0)`);
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(0, 0, coreRadius, 0, Math.PI * 2);
        ctx.fill();
        explosion.particles.forEach((particle) => {
          const distance = particle.distance * progress;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(Math.cos(particle.angle) * distance, Math.sin(particle.angle) * distance, particle.size * (1 - progress * 0.45), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }
    }

        ctx.beginPath();
        ctx.arc(0, 0, zone.radius * (0.88 + progress * 0.12), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      rockImpacts.forEach((impact) => {

        ctx.save();

        ctx.lineTo(-impact.radius * 0.32, -impact.radius * 0.72);
        ctx.lineTo(impact.radius * 0.56, -impact.radius * 0.36);
        ctx.lineTo(impact.radius * 0.72, impact.radius * 0.44);
        ctx.closePath();
        ctx.fill();

    function drawBoss() {

        ctx.save();

    const PARTY_COLORS = ['#fbbf24', '#fb7185', '#a78bfa', '#22d3ee', '#34d399', '#f97316'];

    function getPartyColor(offset = 0) {
      const cycle = performance.now() / 1000 / 1.35 + offset;
      const index = Math.floor(cycle) % PARTY_COLORS.length;
      const nextIndex = (index + 1) % PARTY_COLORS.length;
      const progress = cycle - Math.floor(cycle);
      const from = PARTY_COLORS[index].match(/\w\w/g).map((value) => parseInt(value, 16));
      const to = PARTY_COLORS[nextIndex].match(/\w\w/g).map((value) => parseInt(value, 16));
      const smooth = progress * progress * (3 - 2 * progress);
      return `rgb(${from.map((value, index) => Math.round(value + (to[index] - value) * smooth)).join(',')})`;
    }

    function drawUI() {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = `bold ${MOBILE_LAYOUT ? 16 : 20}px "IBM Plex Sans KR", "Malgun Gothic", sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(`점수: ${score}`, 24, MOBILE_LAYOUT ? 32 : 32);
      ctx.fillText(`레벨: ${player.level}`, 24, MOBILE_LAYOUT ? 58 : 58);
      ctx.fillStyle = currentStage === 2 ? '#fde68a' : 'rgba(255,255,255,0.72)';
      ctx.font = `bold ${MOBILE_LAYOUT ? 13 : 15}px "IBM Plex Sans KR", "Malgun Gothic", sans-serif`;
      ctx.fillText(currentStage === 2 ? '스테이지 2 · 설원' : '스테이지 1', 24, MOBILE_LAYOUT ? 80 : 82);

      const barX = MOBILE_LAYOUT ? 138 : WIDTH / 2 - 190;
      const barY = MOBILE_LAYOUT ? 20 : 22;
      const barWidth = MOBILE_LAYOUT ? WIDTH - barX - 62 : 380;
      const barHeight = MOBILE_LAYOUT ? 18 : 24;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(barX, barY, barWidth, barHeight);
      const filledWidth = choiceOpen ? barWidth : barWidth * (player.exp / player.expToNext);
      if (choiceOpen) {
        const partyGradient = ctx.createLinearGradient(barX, barY, barX + barWidth, barY);
        const partyColor = getPartyColor();
        partyGradient.addColorStop(0, partyColor);
        partyGradient.addColorStop(0.33, getPartyColor(0.23));
        partyGradient.addColorStop(0.66, getPartyColor(0.46));
        partyGradient.addColorStop(1, getPartyColor(0.69));
        ctx.save();
        ctx.shadowColor = partyColor;
        ctx.shadowBlur = 18;
        ctx.fillStyle = partyGradient;
        ctx.fillRect(barX, barY, filledWidth, barHeight);
        ctx.beginPath();
        ctx.rect(barX, barY, filledWidth, barHeight);
        ctx.clip();
        const now = performance.now() / 1000;
        for (let i = 0; i < 22; i++) {
          const sparkleX = barX + ((now * 125 + i * 29) % (barWidth + 24)) - 12;
          const sparkleY = barY + barHeight / 2 + Math.sin(now * 6 + i) * 5;
          const sparkleSize = 1.5 + (i % 3);
          ctx.fillStyle = i % 2 ? '#fff' : getPartyColor(i * 0.17);
          ctx.globalAlpha = 0.45 + 0.55 * Math.sin(now * 8 + i) ** 2;
          ctx.beginPath();
          ctx.arc(sparkleX, sparkleY, sparkleSize, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      } else {
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(barX, barY, filledWidth, barHeight);
      }

    function drawTouchJoystick() {
      if (!usesTouchControls()

    function drawChoiceCelebration() {
      const now = performance.now() / 1000;
      choiceParticles.forEach((particle) => {
        const cycle = (now / particle.duration + particle.phase / (Math.PI * 2)) % 1;
        const x = particle.x + Math.sin(now * 3 + particle.phase) * 12 + particle.drift * (cycle - 0.5);
        const y = particle.y - cycle * particle.rise;
        const alpha = Math.sin(cycle * Math.PI) * 0.9;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 13;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(x, y, particle.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff7b2';
        ctx.beginPath();
        ctx.arc(x - particle.size * 0.22, y - particle.size * 0.22, particle.size * 0.36, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawChoiceLabel(label, x, y, maxWidth, maxLines = 3, lineHeight = 20) {
      const words = label.split(' ');
      const lines = [];
      let line = '';
      words.forEach((word) => {
        const candidate = line ? `${line} ${word}` : word;
        if (ctx.measureText(candidate).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      });
      if (line) lines.push(line);
      lines.slice(0, maxLines).forEach((text, index) => ctx.fillText(text, x, y + index * lineHeight));
    }

    function getAchievementLayout(scrollOffset = achievementScroll) {
      const portraitLayout = MOBILE_LAYOUT;
      const rowSpacing = portraitLayout ? 36 : 42;
      // A group title needs its own vertical space. At 18px it was painted
      // first and then covered by the next achievement row, leaving only a
      // sliver of the Korean text visible on mobile.
      const groupSpacing = portraitLayout ? 34 : 28;
      let y = (portraitLayout ? 142 : 190) - scrollOffset;
      let previousGroup = '';
      return ACHIEVEMENTS.map((achievement) => {
        const showGroup = achievement.group !== previousGroup;
        if (showGroup) y += groupSpacing;
        const row = { achievement, y, showGroup };
        y += rowSpacing;
        previousGroup = achievement.group;
        return row;
      });
    }

    function getAchievementScrollMax() {
      const layout = getAchievementLayout(0);
      const lastRow = layout[layout.length - 1];
      const viewportBottom = MOBILE_LAYOUT ? 780 : 535;
      const rowBottomOffset = MOBILE_LAYOUT ? 12 : 10;
      return Math.max(0, lastRow.y + rowBottomOffset - viewportBottom);
    }
